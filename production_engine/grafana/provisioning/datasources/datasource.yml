apiVersion: 1

datasources:
  - name: GasPredict-DB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: gaspredict
    secureJsonData:
      password: $__env{DB_PASSWORD}
    jsonData:
      database: gaspredict
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: true
