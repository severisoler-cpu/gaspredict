apiVersion: 1

providers:
  - name: 'GasPredict Dashboards'
    orgId: 1
    folder: 'GasPredict'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
